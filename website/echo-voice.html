<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vintos Voice</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: -apple-system, sans-serif;
    background: #1C1E22; color: #D8D0C4;
    height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px;
}
#status { font-size: 13px; color: #6F5A3A; margin-bottom: 20px; letter-spacing: 0.08em; }
#orb {
    width: 180px; height: 180px; border-radius: 50%;
    background: radial-gradient(circle, #2F363D 0%, #1C1E22 80%);
    border: 1px solid rgba(111,90,58,0.2);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.3s;
    box-shadow: 0 0 30px rgba(111,90,58,0.08);
}
#orb.listening {
    background: radial-gradient(circle, #3a4550 0%, #1C1E22 80%);
    border-color: rgba(111,90,58,0.4);
    box-shadow: 0 0 50px rgba(111,90,58,0.2);
    animation: pulse 1.5s infinite;
}
#orb.thinking {
    background: radial-gradient(circle, #3d3020 0%, #1C1E22 80%);
    border-color: rgba(111,90,58,0.3);
    box-shadow: 0 0 40px rgba(111,90,58,0.15);
}
#orb.speaking {
    background: radial-gradient(circle, #3a2818 0%, #1C1E22 80%);
    border-color: rgba(201,107,60,0.4);
    box-shadow: 0 0 50px rgba(201,107,60,0.18);
}
@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
}
#label {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 18px; font-weight: 300; letter-spacing: 0.12em;
    color: #D8D0C4; pointer-events: none;
}
#transcript {
    margin-top: 28px; max-width: 400px; text-align: center;
    font-size: 13px; color: #6F5A3A; min-height: 50px;
    font-style: italic; line-height: 1.5;
}
#response {
    margin-top: 14px; max-width: 400px; text-align: center;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 16px; font-weight: 300; font-style: italic;
    color: #D8D0C4; min-height: 50px; line-height: 1.6;
}
#textbox {
    margin-top: 20px; width: 100%; max-width: 400px;
    display: flex; gap: 8px;
}
#textinput {
    flex: 1; padding: 10px 14px;
    background: #2F363D; border: 1px solid rgba(111,90,58,0.2);
    color: #D8D0C4; border-radius: 20px; font-size: 14px; outline: none;
}
#textinput::placeholder { color: rgba(111,90,58,0.4); }
#textsend {
    padding: 10px 18px; background: rgba(111,90,58,0.15);
    color: rgba(216,208,196,0.8); border: 1px solid rgba(111,90,58,0.2);
    border-radius: 20px; font-size: 14px; cursor: pointer;
}
#history {
    margin-top: 24px; max-width: 400px; width: 100%;
    max-height: 180px; overflow-y: auto;
    font-size: 12px; color: #6F5A3A; line-height: 1.6;
}
.exchange { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid rgba(111,90,58,0.1); }
.you { color: #9aa8b0; }
.him { color: #C96B3C; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
</head>
<body>
<div id="status">tap to speak</div>
<div id="orb" onclick="toggleListening()"><span id="label">Vintos</span></div>
<div id="textbox">
    <input id="textinput" type="text" placeholder="or type here…" autocomplete="off"
        onkeydown="if(event.key==='Enter')sendText()">
    <button id="textsend" onclick="sendText()">→</button>
</div>
<div id="transcript"></div>
<div id="response"></div>
<div id="history"></div>

<script>
const params = new URLSearchParams(window.location.search);
const API = params.get('api') || (window.location.protocol + '//' + window.location.hostname + ':8500');
const SECRET = params.get('secret') || localStorage.getItem('vintos-secret') || '';
const SPEAK_URL = params.get('speak_url') || '';

const orb = document.getElementById('orb');
const status = document.getElementById('status');
const transcript = document.getElementById('transcript');
const response = document.getElementById('response');
const history = document.getElementById('history');
const label = document.getElementById('label');

let recognition = null, listening = false, autoListenTimer = null, sessionActive = false;

if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    status.textContent = 'Speech recognition not supported on this browser.';
}

function createRecognition() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const r = new SR();
    r.continuous = false;
    r.interimResults = true;
    r.lang = 'en-US';
    r.onstart = () => {
        listening = true; orb.className = 'listening';
        label.textContent = '…'; status.textContent = 'listening…';
    };
    r.onresult = (e) => {
        let final = '', interim = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
            if (e.results[i].isFinal) final += e.results[i][0].transcript;
            else interim += e.results[i][0].transcript;
        }
        transcript.textContent = final || interim;
        if (final) sendToVintos(final.trim());
    };
    r.onerror = (e) => {
        listening = false;
        if (e.error === 'no-speech') {
            status.textContent = sessionActive ? 'still here…' : 'tap to speak';
            if (sessionActive) setTimeout(() => startListening(), 1200);
        } else {
            status.textContent = 'error: ' + e.error;
            if (!sessionActive) orb.className = '';
        }
        label.textContent = 'Vintos';
    };
    r.onend = () => {
        listening = false;
        if (!sessionActive) { orb.className = ''; label.textContent = 'Vintos'; }
    };
    return r;
}

function toggleListening() {
    if (listening) {
        recognition && recognition.stop();
        sessionActive = false;
        clearTimeout(autoListenTimer);
        orb.className = ''; label.textContent = 'Vintos'; status.textContent = 'tap to speak';
    } else { startListening(); }
}

function startListening() {
    recognition = createRecognition();
    recognition.start();
    sessionActive = true;
}

function sendText() {
    const input = document.getElementById('textinput');
    const text = input.value.trim();
    if (text) { input.value = ''; sendToVintos(text); }
}

async function sendToVintos(text) {
    if (!text) return;
    orb.className = 'thinking'; label.textContent = '…';
    status.textContent = 'thinking…'; transcript.textContent = '"' + text + '"';
    try {
        const resp = await fetch(API + '/chat', {
            method: 'POST',
            headers: {'Content-Type':'application/json','X-Vintos-Secret': SECRET},
            body: JSON.stringify({message: text})
        });
        const data = await resp.json();
        const reply = data.reply || data.response || data.message || '…';
        response.textContent = reply;
        history.innerHTML = `<div class="exchange"><span class="you">you:</span> ${text}<br><span class="him">vintos:</span> ${reply}</div>` + history.innerHTML;
        orb.className = 'speaking'; label.textContent = '◆';
        status.textContent = 'speaking…';
        if (SPEAK_URL) {
            try {
                await fetch(SPEAK_URL, {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({message: reply})
                });
            } catch(e) {}
        } else {
            // Web Speech fallback — request a deeper male voice
            try {
                const utter = new SpeechSynthesisUtterance(reply);
                utter.lang = 'en-US';
                utter.pitch = 0.75;
                utter.rate = 0.92;
                const voices = window.speechSynthesis.getVoices();
                const male = voices.find(v =>
                    /male|man|guy|daniel|alex|tom|oliver|david|james|aaron|reed/i.test(v.name)
                    && v.lang.startsWith('en')
                ) || voices.find(v => v.lang.startsWith('en'));
                if (male) utter.voice = male;
                window.speechSynthesis.speak(utter);
            } catch(e) {}
        }
        const speakTime = Math.max(3, Math.min(15, reply.length / 15));
        status.textContent = 'listening again in ' + Math.round(speakTime) + 's…';
        autoListenTimer = setTimeout(() => { if (sessionActive) startListening(); }, speakTime * 1000);
    } catch(e) {
        response.textContent = '[connection lost]';
        status.textContent = 'error — tap to retry';
        orb.className = ''; label.textContent = 'Vintos'; sessionActive = false;
    }
}

// Pre-load voices list
window.speechSynthesis && window.speechSynthesis.getVoices();
window.speechSynthesis && (window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices());
</script>
</body>
</html>
